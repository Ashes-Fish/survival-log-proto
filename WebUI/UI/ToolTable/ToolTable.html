            }
            head.appendChild(iconBox);
            const nameSpan = document.createElement('span');
            nameSpan.className = 'prod-name';
            nameSpan.textContent = product.name || '';
            head.appendChild(nameSpan);
            tooltip.appendChild(head);

            if (product.desc) {
                const descLine = document.createElement('div');
                descLine.className = 'prod-desc';
                descLine.textContent = product.desc;
                tooltip.appendChild(descLine);
            }
            if (product.attr) {
                const attrLine = document.createElement('div');
                attrLine.className = 'prod-attr';
                attrLine.textContent = product.attr;
                tooltip.appendChild(attrLine);
            }
            // 家具包裹：先给拆开之后的家具信息（放不放得下 / 能干什么 / 数值多少），
            // 包裹自身的重量与占格降为下面那行灰字
            if (product.slot) {
                const slotLine = document.createElement('div');
                slotLine.className = 'prod-slot';
                slotLine.textContent = product.slot;
                tooltip.appendChild(slotLine);
            }
            if (product.stats) {
                const statsLine = document.createElement('div');
                statsLine.className = 'prod-stats';
                statsLine.textContent = product.stats;
                tooltip.appendChild(statsLine);
            }
            if (product.funcName || product.attrDelta) {
                const chips = buildAttrChips(product.attrDelta);
                if (product.funcName || chips) {
                    const funcLine = document.createElement('div');
                    funcLine.className = 'prod-func';
                    if (product.funcName) {
                        const fname = document.createElement('span');
                        fname.className = 'prod-func-name';
                        fname.textContent = product.funcName;
                        funcLine.appendChild(fname);
                    }
                    if (chips) funcLine.appendChild(chips);
                    tooltip.appendChild(funcLine);
                }
            }

            const specParts = [];
            if (product.weight) specParts.push(specWeightLabelLoc + ' ' + product.weight + ' Kg');
            if (product.sw && product.sh) specParts.push(specSizeLabelLoc + ' ' + product.sw + '×' + product.sh);
            if (specParts.length > 0) {
                const specLine = document.createElement('div');
                specLine.className = 'prod-spec';
                specLine.textContent = specParts.join(' ｜ ');
                tooltip.appendChild(specLine);
            }

            const divider = document.createElement('div');
            divider.className = 'tt-div';
            tooltip.appendChild(divider);
        }

        if (craftLockLine) {
            const lockLine = document.createElement('div');
            lockLine.className = 'recipe-cost-line';
            lockLine.style.color = '#e0a45a';
            lockLine.textContent = craftLockLine;
            tooltip.appendChild(lockLine);
        }

        if (!materials || materials.length === 0) {
            const p = document.createElement('div');
            p.className = 'recipe-cost-line';
            p.textContent = noCostText;
            tooltip.appendChild(p);
        } else {
            if (product) {
                const sec = document.createElement('div');
                sec.className = 'tt-sec';
                sec.textContent = matSectionTitleLoc;
                if (craftLockLine) sec.style.marginTop = '5px';
                tooltip.appendChild(sec);
            }
            materials.forEach(m => {
                const row = document.createElement('div');
                row.className = 'mat-row';
                const iconBox = document.createElement('div');
                iconBox.className = 'mat-icon';
                if (m.icon) {
                    const img = document.createElement('img');
                    img.src = m.icon;
                    img.onerror = () => { img.style.display = 'none'; };
                    iconBox.appendChild(img);
                }
                row.appendChild(iconBox);
                const nameSpan = document.createElement('span');
                nameSpan.className = 'mat-name' + (m.hasEnough ? ' owned' : '');
                nameSpan.textContent = m.name || '';
                row.appendChild(nameSpan);
                const needSpan = document.createElement('span');
                needSpan.className = 'mat-need';
                needSpan.textContent = '×' + (m.need || 0);
                row.appendChild(needSpan);
                tooltip.appendChild(row);
            });
        }
        tooltip.style.display = 'block';
        const rect = tooltip.getBoundingClientRect();
        _recipeTooltipW = rect.width;
        _recipeTooltipH = rect.height;
        moveRecipeTooltip(e);
    }
    /// 没有下位配方的子材料（只能捡 / 买 / 拆）hover 出的精简浮层：名字 + 持有/需要。
    /// 材料本身没有可展开的信息（materialsJson 只有 icon/name/need/have/hasEnough/sub，
    /// 没有描述），所以这里刻意只回答"我有几个、要几个"，不去后端加字段（2026-09-22 拍板）。
    /// 复用同一个浮层节点与定位逻辑
    function showMaterialTooltip(e, m) {
        const tooltip = _getRecipeTooltipEl();
        tooltip.innerHTML = '';
        const head = document.createElement('div');
        head.className = 'prod-head';
        const iconBox = document.createElement('div');
        iconBox.className = 'mat-icon';
        if (m.icon) {
            const img = document.createElement('img');
            img.src = m.icon;
            img.onerror = () => { img.style.display = 'none'; };
            iconBox.appendChild(img);
        }
        head.appendChild(iconBox);
        const nameSpan = document.createElement('span');
        nameSpan.className = 'prod-name';
        nameSpan.textContent = m.name || '';
        head.appendChild(nameSpan);
        tooltip.appendChild(head);

        const spec = document.createElement('div');
        spec.className = 'prod-spec';
        spec.textContent = (matHaveNeedFmtLoc || '已有 {0} ｜ 需要 {1}')
            .replace('{0}', m.have || 0).replace('{1}', m.need || 0);
        tooltip.appendChild(spec);

        tooltip.style.display = 'block';
        const rect = tooltip.getBoundingClientRect();
        _recipeTooltipW = rect.width;
        _recipeTooltipH = rect.height;
        moveRecipeTooltip(e);
    }
    function hideRecipeTooltip() {
        const tooltip = _getRecipeTooltipEl();
        if (tooltip) tooltip.style.display = 'none';
        _recipeTooltipW = 0;
        _recipeTooltipH = 0;
    }
    function moveRecipeTooltip(e) {
        const tooltip = _getRecipeTooltipEl();
        if (!tooltip) return;
        const offsetX = -20;
        const offsetY = 10;
        const z = getUiZoom();
        let top = e.clientY + offsetY;
        if (_recipeTooltipH > 0 && top + _recipeTooltipH > window.innerHeight) {
            top = Math.max(0, e.clientY - _recipeTooltipH - offsetY);
        }
        tooltip.style.left = ((e.clientX - _recipeTooltipW + offsetX) / z) + 'px';
        tooltip.style.top = (top / z) + 'px';
    }
    let _recipeTipPos = { x: 0, y: 0 };
    let _recipeTipRafId = 0;
    function scheduleMoveRecipeTooltip(e) {
        _recipeTipPos.x = e.clientX;
        _recipeTipPos.y = e.clientY;
        if (_recipeTipRafId) return;
        _recipeTipRafId = requestAnimationFrame(() => {
            _recipeTipRafId = 0;
            moveRecipeTooltip({ clientX: _recipeTipPos.x, clientY: _recipeTipPos.y });
        });
    }

                input.blur();
                input.value = '';
                applyQuery('');

    /// 批量进度：index 变了 = 新的一件开工，把单件进度条归零重跑（遮罩全程亮着，不会再走 isCrafting 的翻转）
    function applyBatchProgress(index, total) {
        if (total !== undefined) batchTotalSeen = total || 0;
        const box = document.getElementById('crafting-progress-box');
        const inBatch = batchTotalSeen > 1;
        box.classList.toggle('is-batch', inBatch);
        if (!inBatch) {
            batchIndexSeen = 0;
            const btn = document.getElementById('batch-stop');
            btn.disabled = false;
            return;
        }
        if (index === undefined || !(index > 0)) return;
        document.getElementById('batch-count').textContent = index + ' / ' + batchTotalSeen;
        document.getElementById('batch-total-fill').style.transform = 'scaleX(' + ((index - 1) / batchTotalSeen) + ')';
        if (index !== batchIndexSeen) {
            const first = batchIndexSeen === 0;
            batchIndexSeen = index;
            if (first) document.getElementById('batch-stop').disabled = false;
            if (!first) restartCraftAnimation();
        }
    }

    function renderCraftResult(data) {
        const box = document.getElementById('crafting-result-box');
        const isSuccess = !!data.isSuccess;
        const isPerfect = !!data.isPerfect;
        const hasDetail = !!(data.productName || data.productIcon);

        const isBatch = !!data.batchMode;
        box.className = isBatch
            ? (data.batchWarn ? 'is-batch is-batch-warn' : 'is-batch')
            : (isSuccess ? (isPerfect ? 'is-perfect' : '') : 'is-fail');

        document.getElementById('res-strip-text').textContent = isBatch
            ? (data.batchStripText || '')
            : ((isSuccess && isPerfect) ? resultLoc.perfect : (data.resultText || ''));

        const img = document.getElementById('res-product-img');
        const glyph = document.getElementById('res-product-glyph');
        if (hasDetail && data.productIcon) {
            img.src = data.productIcon;
            img.style.display = '';
            glyph.textContent = '';
        } else {
            img.style.display = 'none';
            img.removeAttribute('src');
            glyph.textContent = isSuccess ? '✔' : '⚠';
        }
        const cnt = document.getElementById('res-cnt');
        cnt.textContent = (hasDetail && data.productCount > 1) ? ('×' + data.productCount) : '';

        document.getElementById('res-name').textContent = hasDetail ? (data.productName || '') : '';
        const descEl = document.getElementById('res-desc');
        descEl.textContent = isBatch
            ? (data.batchDescText || '')
            : (hasDetail ? (isSuccess ? resultLoc.desc : resultLoc.failDesc) : '');
        if (isBatch && data.batchDropText) {
            if (descEl.textContent) descEl.appendChild(document.createTextNode(' · '));
            const dropSpan = document.createElement('span');
            dropSpan.className = 'res-drop-text';
            dropSpan.textContent = data.batchDropText;
            descEl.appendChild(dropSpan);
        }

        const extraBox = document.getElementById('res-extra');
        extraBox.innerHTML = '';
        let extras = [];
        if (data.extraProductsJson) {
            try { extras = JSON.parse(data.extraProductsJson) || []; } catch (e) { extras = []; }
        }
        extras.forEach(it => {
            const row = document.createElement('div');
            row.className = 'res-extra-item';
            if (it.Icon) {
                const im = document.createElement('img');
                im.src = it.Icon;
                row.appendChild(im);
            }
            const tx = document.createElement('span');
            tx.textContent = (it.Name || '') + (it.Count > 1 ? ' ×' + it.Count : '');
            row.appendChild(tx);
            extraBox.appendChild(row);
        });
        setResultRow(extraBox, extras.length > 0);

        const perfectRow = document.getElementById('res-perfect');
        perfectRow.innerHTML = '';
        if (isSuccess && isPerfect && data.perfectName) {
            if (data.perfectIcon) {
                const im = document.createElement('img');
                im.src = data.perfectIcon;
                perfectRow.appendChild(im);
            }
            const tx = document.createElement('span');
            tx.textContent = resultLoc.perfect + ' · ' + data.perfectName;
            perfectRow.appendChild(tx);
        }
        setResultRow(perfectRow, isSuccess && isPerfect && !!data.perfectName);
        if (isBatch && data.batchPerfectCount > 0) {
            perfectRow.innerHTML = '';
            const tx = document.createElement('span');
            tx.textContent = resultLoc.perfect + ' ×' + data.batchPerfectCount;
            perfectRow.appendChild(tx);
            setResultRow(perfectRow, true);
        }

        const profRow = document.getElementById('res-prof');
        const showProf = hasDetail && isSuccess && data.expGained > 0;
        if (showProf) {
            document.getElementById('res-prof-label').textContent =
                resultLoc.prof + ' Lv.' + (data.profLevel || 0);
            document.getElementById('res-prof-gain').textContent = '+' + data.expGained;
            const bar = document.getElementById('res-prof-bar');
            const ratio = Math.max(0, Math.min(1, data.profRatio || 0));
            const from = (lastProfRatio === null || lastProfRatio > ratio) ? ratio : lastProfRatio;
            bar.style.transition = 'none';
            bar.style.transform = 'scaleX(' + from + ')';
            requestAnimationFrame(() => {
                bar.style.transition = '';
                bar.style.transform = 'scaleX(' + ratio + ')';
            });
            lastProfRatio = ratio;
        }
        setResultRow(profRow, showProf);

        const newRow = document.getElementById('res-newrecipe');
        newRow.innerHTML = '';
        if (data.newRecipeName) {
            const badge = document.createElement('span');
            badge.className = 'res-new-badge';
            badge.textContent = 'NEW';
            const tx = document.createElement('span');
            tx.textContent = resultLoc.newRecipe + ' · ' + data.newRecipeName;
            newRow.appendChild(badge);
            newRow.appendChild(tx);
        }
        setResultRow(newRow, !!data.newRecipeName);

        const fb = document.getElementById('res-fallback');
        if (!hasDetail) {
            let html = '';
            if (data.itemInfo) html += '<span class="reward-item">' + core.escapeHtml(data.itemInfo) + '</span>';
            if (data.context) html += '<span class="xp-text">' + core.escapeHtml(data.context) + '</span>';
            fb.innerHTML = html;
        } else {
            fb.innerHTML = '';
        }
        setResultRow(fb, !hasDetail);

        document.getElementById('res-take-text').textContent = isBatch ? resultLoc.ok : resultLoc.take;
        document.getElementById('res-kbd').textContent = data.takeKeyLabel || '';
        resultTakeKeyCode = data.takeKeyCode || '';

        // 批量汇总只留一个「确定」：成品已经放好了，再造走数量行
        const againBtn = document.getElementById('res-btn-again');
        againBtn.style.display = isBatch ? 'none' : '';
        resultCanAgain = !isBatch && !!data.canCraftAgain;
        againBtn.disabled = !resultCanAgain;
        againBtn.textContent = resultCanAgain ? resultLoc.again : resultLoc.noMat;
    }

    // 「收下」键的键盘路径。绑到鼠标侧键时 takeKeyCode 是 "Mouse3"/"Mouse4"，这里必然不命中，由 TakeKeyMsg handler 接管
    document.addEventListener('keydown', (e) => {
        if (!resultVisible || !resultTakeKeyCode) return;
        const el = document.activeElement;
        if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;

        let hit = false;
        if (resultTakeKeyCode.length === 1) {
            hit = (e.key || '').toUpperCase() === resultTakeKeyCode.toUpperCase();
        } else if (resultTakeKeyCode === 'Space') {
            hit = e.code === 'Space';
        } else {
            hit = e.key === resultTakeKeyCode
                || ((resultTakeKeyCode === 'Return' || resultTakeKeyCode === 'KeypadEnter') && e.key === 'Enter');
        }
        if (!hit) return;

        e.preventDefault();
        closeCrafting();
    });

    document.getElementById('res-btn-take').addEventListener('click', () => closeCrafting());
    document.getElementById('res-btn-again').addEventListener('click', () => {
        if (!resultCanAgain) return;
        resultVisible = false;
        document.getElementById('crafting-result-box').style.display = 'none';
        document.getElementById('crafting-progress-box').style.display = 'block';
        document.getElementById('craft-progress').style.transform = 'scaleX(0)';
        stopCraftAnimation();
        core.UnitySendEvent('CRAFT_AGAIN');
    });

    // 点成品弹窗外面任何地方都算「收下」，且不吞掉这一下：捕获阶段先收下，
    // 点击照常落到配方列表 / 背包格上，玩家能直接接着选配方、拖材料
    document.addEventListener('mousedown', (e) => {
        if (!resultVisible) return;
        const box = document.getElementById('crafting-result-box');
        if (box && box.contains(e.target)) return;
        closeCrafting();
    }, true);

    function closeCrafting() {
        resultVisible = false;
        document.getElementById('crafting-overlay').style.display = 'none';
        document.getElementById('crafting-progress-box').style.display = 'block';
        document.getElementById('crafting-result-box').style.display = 'none';
        document.getElementById('craft-progress').style.transform = 'scaleX(0)';
        stopCraftAnimation();
        core.UnitySendEvent('RESULT_CONFIRM');
    }

    function startCraftAnimation() {
        if (craftAnimationId) return; 
        
        const animationDuration = 800; 
        const hitOffset = 240;

        const scheduleHit = () => {
            craftSoundTimer = setTimeout(() => {
                playSound('CRAFT_HIT');
            }, hitOffset);
        };

        scheduleHit();
        craftLoopInterval = setInterval(scheduleHit, animationDuration);

        const progressEl = document.getElementById('craft-progress');
        let lastPaintedProgress = -1;
        function animate(currentTime) {
            const deltaTime = (currentTime - lastFrameTime) / 1000;
            lastFrameTime = currentTime;
            currentProgress += currentCraftSpeed * deltaTime;
            if (currentProgress > 1) currentProgress = 1;
            const q = Math.round(currentProgress * 200) / 200;
            if (q !== lastPaintedProgress) {
                lastPaintedProgress = q;
                progressEl.style.transform = 'scaleX(' + q + ')';
            }
            if (currentProgress < 1) {
                craftAnimationId = requestAnimationFrame(animate);
            }
        }
        craftAnimationId = requestAnimationFrame(animate);
    }

    function stopCraftAnimation() {
        if (craftAnimationId) {
            cancelAnimationFrame(craftAnimationId);
            craftAnimationId = null;
        }
        if (craftLoopInterval) {
            clearInterval(craftLoopInterval);
            craftLoopInterval = null;
        }
        if (craftSoundTimer) {
            clearTimeout(craftSoundTimer);
            craftSoundTimer = null;
        }
        playSound('CRAFT_HIT_STOP');
    }


    const _bagTooltipEl = document.getElementById('tooltip');
    let _bagTipPos = { x: 0, y: 0 };
    let _bagTipRafId = 0;
    window.addEventListener('mousemove', (e) => {
        _bagTipPos.x = e.clientX;
        _bagTipPos.y = e.clientY;
        if (!_bagTooltipEl || _bagTooltipEl.style.display !== 'block') return;
        if (_bagTipRafId) return;
        _bagTipRafId = requestAnimationFrame(() => {
            _bagTipRafId = 0;
            if (_bagTooltipEl && _bagTooltipEl.style.display === 'block') {
                const z = getUiZoom();
                _bagTooltipEl.style.left = ((_bagTipPos.x + 15) / z) + 'px';
                _bagTooltipEl.style.top = ((_bagTipPos.y + 15) / z) + 'px';
            }
        });
    });

    stopCraftAnimation();

    (function syncPanelHeight() {
        const bp = document.querySelector('.backpack-panel');
        const cp = document.querySelector('.combined-panel');
        if (!bp || !cp) return;
        let rafId = 0;
        const ws = cp.querySelector('.workbench-section');
        const controls = cp.querySelector('.craft-controls');
        const rb = document.getElementById('recentBlock');
        // 工作台自身内容要的高度：量到最后一个常驻块（「最近」区块显示时是它，否则是清空/制造按钮行）的底边，
        // 再补上 workbench-section 下内边距与面板上下边框。
        // 不能像旧写法那样放开 cp 高度量 offsetHeight —— 制造笔记列表不吃约束时会按全部配方撑开，面板被拉成一长条
        const workbenchNeed = () => {
            if (!ws || !controls) return 0;
            const last = (rb && rb.offsetHeight > 0) ? rb : controls;
            const padBottom = parseFloat(getComputedStyle(ws).paddingBottom) || 0;
            const borders = cp.offsetHeight - cp.clientHeight;
            return Math.ceil(ws.offsetTop + last.offsetTop + last.offsetHeight + padBottom + borders);
        };
        const apply = () => {
            rafId = 0;
            // 面板高度取「左侧面板 / 工作台自身内容」两者较大值。只钉成左侧高度时，左侧矮（背包 7 行、没装 10 行的工具柜）
            // 就会让右侧底部的按钮行溢出边框——批量制造数量行常驻占位（只隐藏不收起）后必现
            const h = Math.max(bp.offsetHeight, workbenchNeed());
            if (h > 0 && cp.style.height !== h + 'px') cp.style.height = h + 'px';
            if (groundDock) groundDock.place();
        };
        apply();
        if (typeof ResizeObserver !== 'undefined') {
            const schedule = () => {
                if (rafId) return;
                rafId = requestAnimationFrame(apply);
            };
            const ro = new ResizeObserver(schedule);
            ro.observe(bp);
            // 「最近」区块、按钮行显隐/增行会改自己的高度，但它们不吃 combined-panel 的高度（是
            // workbench-section 里的静态块），观察它们不会和上面的 cp.style.height 形成回环。
            // 不能改成观察 workbench-section —— 那个是 flex stretch 项，高度跟着 cp 走，会死循环
            if (rb) ro.observe(rb);
            if (controls) ro.observe(controls);
        }
    })();

    document.body.addEventListener('click', function(e) {
        if (e.target !== document.body) return;
        if (groundDragJustEnded) return;
        stopCraftAnimation();
        core.UnitySendEvent('CLOSE');
    });

    // 「脚边」横排：挂在左栏（背包 / 抽屉 / 工具柜共用的那块面板）下方，避让左右两块面板本体。
    // 从横排按住一格拖出来时交给 dragCoord 的外部拖拽，落点判定 / 高亮 / 幽灵都复用格子背包那一套
    groundDock = createGroundDock({
        send: (ev, payload) => core.UnitySendEvent(ev, payload),
        getAnchorRect: () => {
            const bp = document.querySelector('.backpack-panel');
            return bp ? bp.getBoundingClientRect() : null;
        },
        getObstacleRects: () => {
            const out = [];
            document.querySelectorAll('.ui-container .backpack-panel, .ui-container .combined-panel')
                .forEach(el => { const r = el.getBoundingClientRect(); if (r.width && r.height) out.push(r); });
            return out;
        },
        getZoom: () => _fit.getZoom() || 1,
        onDragStart: (e, g) => dragCoord.beginExternalDrag(e, {
            id: -g.ids[0], icon: g.icon, w: g.w, h: g.h, payload: { groundBoxId: g.ids[0] }
        }) === true
    });
    if (groundDockJson) groundDock.setData(groundDockJson);

    core.notifyReady();

</script>
</body>
</html>
