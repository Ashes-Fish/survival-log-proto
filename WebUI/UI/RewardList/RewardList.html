<div id="app">
  <div class="modal-overlay" :class="[{ 'is-leaving': leaving }, presClass]" @click="handleOverlayClick">
    <div class="panel-wrap" data-interactive @animationend.self="onWrapAnimEnd">
      <button class="close-x" @click="guardedClose" aria-label="Close">✕</button>
      <div class="panel" :class="{ 'is-explore': s.variant === 'explore', 'is-bumper': isBumper }">
        <div v-if="isNewDish" class="rl-newhead">
          <div class="rl-tag" v-if="s.tag">{{ s.tag }}</div>
          <div class="rl-title" v-if="s.title">{{ s.title }}</div>
        </div>
        <div v-if="s.variant === 'explore'" class="result-head" :class="s.tone">
          <div class="rtitle">{{ s.title }}</div>
          <div class="rdesc">{{ s.desc }}</div>
          <div v-if="s.note" class="rnote">{{ s.note }}</div>
        </div>
        <div v-else-if="isBumper" class="bumper-head">
          <div class="bh-title">{{ s.title }}</div>
          <div class="bh-sub" v-if="s.desc">{{ s.desc }}</div>
        </div>
        <div v-else-if="!isNewDish && s.desc" class="src-head">
          <div class="sh-title" v-if="s.title">{{ s.title }}</div>
          <div class="sh-sub">{{ s.desc }}</div>
        </div>

        <div v-if="s.hasItems" class="body-area">
          <div class="list-label">{{ s.listLabel || (s.variant === 'explore' ? '带回的物资' : '本次获得') }}</div>
          <div class="reward-list" @click.stop>
            <div class="cell" :class="{ 'is-bumper': it.kind === 1 }"
                 v-for="(it, i) in items" :key="i" :style="{ animationDelay: (i*70) + 'ms' }">
              <div class="slot">
                <span v-if="isNewDish" class="rl-rays"></span>
                <span v-if="it.kind === 1" class="rip"></span>
                <span v-if="it.kind === 1 && it.mark" class="bmk">{{ it.mark }}</span>
                <span v-else-if="isPerfect && s.tag" class="rl-pfmark">{{ s.tag }}</span>
                <span v-if="isNewDish" class="halo"></span>
                <div class="item">
                <img v-if="isNewDish && it.icon" class="rl-silhouette" :src="it.icon" alt="" draggable="false">
                <img v-if="it.icon" :src="it.icon" alt="" draggable="false">
                <span v-else class="icon-ph">{{ it.name }}</span>
                <span v-if="it.count > 1" class="item-count">x{{ it.count }}</span>
              </div></div>
              <div class="cell-name">
                <template v-if="isNewDish"><span v-for="(ch, ci) in [...it.name]" :key="ci"
                  :style="{ animationDelay: (380 + ci*55) + 'ms' }">{{ ch }}</span></template>
                <template v-else>{{ it.name }}</template>
              </div>
            </div>
          </div>
        </div>
        <div v-else-if="s.variant === 'explore'" class="empty">— {{ s.emptyLabel || '未带回任何物资' }} —</div>
        <div v-if="isNewDish && s.desc" class="rl-foot">{{ s.desc }}</div>
        <button v-if="s.confirmLabel" class="rl-confirm" @click="guardedClose">{{ s.confirmLabel }}</button>
      </div>
    </div>
  </div>
</div>

<script>
  const core = createWebUICore('RewardList');
  const { createApp, reactive, computed, ref, onMounted, onUnmounted } = Vue;

  const s = reactive({ variant:'addItem', title:'', desc:'', tone:'', itemsJson:'[]', hasItems:false, listLabel:'', emptyLabel:'', note:'',
                       presentation:'modal', tag:'', confirmLabel:'' });
  const leaving = ref(false);
  const canClose = ref(false);
  let closed = false;
  let closeSent = false;

  const items = computed(() => {
    try { return JSON.parse(s.itemsJson || '[]'); } catch (e) { return []; }
  });

  const isBumper = computed(() => s.variant === 'addItem' && s.tone === 'bumper');

  const pres = computed(() => s.variant === 'addItem' ? (s.presentation || 'modal') : 'explore');
  const presClass = computed(() => 'pres-' + pres.value);
  const isNewDish = computed(() => pres.value === 'newDish');
  const isPerfect = computed(() => pres.value === 'slimPerfect');

  const frameClipOn = computed(() => pres.value !== 'explore' && pres.value !== 'newDish');
  const frameClipPad = computed(() => pres.value === 'modal' ? 24 : 40);
  function applyFrameClip() {
    if (core.clickThrough && core.clickThrough.setFrameClip) {
      core.clickThrough.setFrameClip(frameClipOn.value, frameClipPad.value);
    }
  }

  core.registerHandlers({
    'WebUI_RewardList_UpdateMsg': (data) => {
      if (typeof data.variant === 'string') s.variant = data.variant;
      if (typeof data.title === 'string') s.title = data.title;
      if (typeof data.desc === 'string') s.desc = data.desc;
      if (typeof data.tone === 'string') s.tone = data.tone;
      if (typeof data.itemsJson === 'string') s.itemsJson = data.itemsJson;
      if (typeof data.hasItems === 'boolean') s.hasItems = data.hasItems;
      if (typeof data.listLabel === 'string') s.listLabel = data.listLabel;
      if (typeof data.emptyLabel === 'string') s.emptyLabel = data.emptyLabel;
      if (typeof data.note === 'string') s.note = data.note;
      if (typeof data.presentation === 'string') s.presentation = data.presentation;
      if (typeof data.tag === 'string') s.tag = data.tag;
      if (typeof data.confirmLabel === 'string') s.confirmLabel = data.confirmLabel;
      if (data.autoClosing === true && !closed) {
        closed = true; leaving.value = true;
        if (core.clickThrough) core.clickThrough.stop();
      } else if (data.autoClosing === false && closed && !closeSent) {
        closed = false; leaving.value = false;
        if (core.clickThrough) core.clickThrough.start();
      }
      applyFrameClip();
      if (!closed && core.clickThrough && core.clickThrough.syncNowAfterReflow) {
        core.clickThrough.syncNowAfterReflow();
      }
    }
  });

  function onClose() {
    if (closed) return;
    closed = true; leaving.value = true; closeSent = true;
    if (core.clickThrough) core.clickThrough.stop();
    setTimeout(() => core.UnitySendEvent('CLOSE'), 340);
  }

    if (!canClose.value) return;
    onClose();

    if (s.variant === 'explore' && e.target !== e.currentTarget) return;
    if ((pres.value === 'slim' || pres.value === 'slimPerfect') && e.target === e.currentTarget) return;
    guardedClose();
  }

    if (!closed && core.clickThrough) core.clickThrough.syncNowAfterReflow();
  }

  createApp({
    setup() {
      onMounted(() => {
        window.addEventListener('keydown', onKeydown);
        setTimeout(() => { canClose.value = true; }, 120);
        if (core.clickThrough) core.clickThrough.start();
      });
      onUnmounted(() => {
        window.removeEventListener('keydown', onKeydown);
        if (core.clickThrough) core.clickThrough.stop();
      });
      return { s, items, isBumper, leaving, handleOverlayClick, guardedClose,
               presClass, isNewDish, isPerfect, onWrapAnimEnd };
    }
  }).mount('#app');

  core.notifyReady();
</script>
