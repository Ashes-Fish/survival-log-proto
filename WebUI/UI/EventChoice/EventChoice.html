<script src="../../webui-core.js"></script>
<link rel="stylesheet" href="../../webui-common.css">
<style>

  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:var(--wc-font-main);
    height:100vh; overflow:hidden; background:transparent; color:#e6e6e6;
    user-select:none; -webkit-user-select:none;
  }

  .overlay {
    position:fixed; inset:0; display:flex; justify-content:center; align-items:center;
    background:rgba(0,0,0,0.42); z-index:100;
  }

  .panel {
    position:relative; width:616px; display:flex; flex-direction:column; align-items:center;
    padding:36px 26px 30px; gap:10px;
    max-height:100vh;
    background:
      linear-gradient(rgba(0,0,0,.40), rgba(0,0,0,.40)),
      url('../../Res/GameResult/UI_Common_Bg_XL_001.png');
    background-size:100% 100%, 100% 100%;
    background-repeat:no-repeat, no-repeat;
    background-position:center, center;
    background-blend-mode:multiply, normal;
    filter:drop-shadow(0 10px 28px rgba(0,0,0,.8));
    animation:panelIn .34s cubic-bezier(.19,1,.22,1);
    transform-origin:center center;
  }
  @keyframes panelIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
  .panel.dense  { gap:8px; }
  .panel.dense2 { gap:7px; }

  .icon {
    width:486px; height:324px; flex:0 2 auto; min-height:0; position:relative; overflow:hidden;
    background:url('../../Res/GameResult/UI_Death_TitleBG_001.png') center/cover;
  }
  .panel.dense  .icon { width:438px; height:292px; }
  .panel.dense2 .icon { width:390px; height:260px; }
  .icon img {
    width:100%; height:100%; object-fit:cover; display:block;
    transform-origin:center center;
    animation:kenBurns 20s cubic-bezier(.22,.61,.36,1) .18s forwards;
  }
  @keyframes kenBurns { from{ transform:scale(1); } to{ transform:scale(1.10); } }
  html.quality-low .icon img { animation:none; }

  .ibar {
    position:absolute; left:0; right:0; bottom:0; z-index:2;
    display:flex; align-items:center; justify-content:center;
    padding:34px 62px 12px;
    background:linear-gradient(180deg,
      rgba(0,0,0,0) 0%, rgba(0,0,0,.34) 30%, rgba(0,0,0,.72) 58%, rgba(0,0,0,.92) 100%);
  }
  .panel.dense  .ibar { padding:34px 15px 12px; }
  .panel.dense2 .ibar { padding:31px 13px 11px; }
  .icon::after {
    content:''; position:absolute; inset:0; pointer-events:none; z-index:1;
    background:url('../../Res/GameResult/UI_VX_Hited_Dark.png') center/100% 100% no-repeat;
    opacity:.86;
    box-shadow:inset 0 0 26px 6px rgba(0,0,0,.34);
  }

  /* 徽标放不下时整行换到标题上方（英文 Companionship 等长徽标会把标题挤成一词一行、顶出插图） */
  .tw { position:relative; display:inline-flex; flex-wrap:wrap; align-items:center; justify-content:center;
        gap:6px 12px; max-width:100%; }
  .badge {
    flex:0 0 auto;
    white-space:nowrap;
    font-family:var(--wc-font-main); font-size:17px; font-weight:900; letter-spacing:3px; padding:5px 13px;
    color:#ffe0a0; background:rgba(122,84,20,.88); border:1px solid rgba(240,200,110,.95);
    text-shadow:0 1px 3px rgba(0,0,0,.95);
    box-shadow:0 0 14px rgba(226,176,80,.42), 0 2px 6px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,228,168,.28);
  }
  .badge.emg {
    color:#ffd0be; background:rgba(140,32,24,.9); border-color:rgba(248,148,124,.95);
    box-shadow:0 0 15px rgba(226,100,76,.5), 0 2px 6px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,200,180,.28);
  }
  /* 关注（ShowType=Milestone）：冷灰蓝，与危机红、默认琥珀金三路区分 */
  .badge.mls {
    color:#d2e2f0; background:rgba(34,58,84,.9); border-color:rgba(146,188,222,.92);
    box-shadow:0 0 14px rgba(120,168,212,.4), 0 2px 6px rgba(0,0,0,.6), inset 0 1px 0 rgba(198,224,246,.26);
  }
  /* 结局线路徽标：替换上面的角标。形制同 .badge，颜色取线路色（--lc），前面带线路图标。
     线路色与 CoreUI1.html 事件列表行首图标同源，改色两处同改。 */
  .badge.line {
    display:inline-flex; align-items:center; gap:6px; padding:5px 13px 5px 10px; letter-spacing:2px;
    color:var(--lc); background:color-mix(in srgb, var(--lc) 20%, rgba(0,0,0,.84)); border-color:var(--lc);
    box-shadow:0 0 14px color-mix(in srgb, var(--lc) 45%, transparent), 0 2px 6px rgba(0,0,0,.6);
  }
  .badge.line svg { width:18px; height:18px; fill:currentColor; flex:0 0 auto; }
  .panel.dense  .badge { font-size:16px; padding:4px 12px; }
  .panel.dense2 .badge { font-size:15px; padding:4px 11px; }

  .title {
    font-family:var(--wc-font-main); font-size:30px; font-weight:900; letter-spacing:2px;
    min-width:0; overflow-wrap:break-word;
    color:rgb(240,214,170); text-align:center; line-height:1.2;
    text-shadow:0 2px 6px rgba(0,0,0,.95), 0 0 20px rgba(0,0,0,.7);
  }
  .title.mainv {
    color:rgb(252,226,168);
    text-shadow:0 2px 0 rgba(60,38,10,.95), 0 3px 10px rgba(0,0,0,.95),
                0 0 26px rgba(236,186,96,.55), 0 0 46px rgba(226,164,64,.28);
  }
  .panel.dense  .title { font-size:27px; }
  .panel.dense2 .title { font-size:25px; }
  .title.emg { color:rgb(240,150,118); }
  .title.mls { color:rgb(206,224,240); }
  .mult {
    display:inline-block; margin-left:10px; padding:1px 8px; font-size:13px; font-weight:900; vertical-align:middle;
    color:#fff4d8; background:rgba(180,60,30,.85);
  }

  .tline { position:relative; width:502px; display:flex; align-items:center; justify-content:center; min-height:34px; padding:0 62px; }
  .tline .title { text-shadow:0 2px 5px rgba(0,0,0,.75); }

  .cline { width:502px; display:flex; align-items:center; justify-content:center; min-height:28px; }
  .clock {
    display:flex; align-items:center; gap:8px;
    font-family:var(--wc-font-main); font-size:22px; font-weight:900;
    color:rgb(226,188,98); letter-spacing:2px; font-variant-numeric:tabular-nums;
    text-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  .clock .dot { width:16px; height:16px; border:2px solid currentColor; border-radius:50%; position:relative; }
  .clock .dot::after { content:''; position:absolute; left:50%; top:2px; width:2px; height:5px; background:currentColor; }
  .emgv .clock { color:rgb(230,142,112); }
  .clock.urgent { color:rgb(232,108,86); animation:cdPulse 1s ease-in-out infinite; }
  @keyframes cdPulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.72; transform:scale(1.05)} }

  .hr { width:502px; height:1px; flex:0 0 auto;
        background:linear-gradient(90deg,transparent,rgba(160,120,60,.55),transparent); }

  .ctx { width:502px; flex:0 6 auto; min-height:0; font-size:19px; line-height:1.7;
         color:rgb(203,191,81); font-style:italic;
         letter-spacing:.5px; text-align:left; white-space:pre-wrap;
         overflow-y:auto; overscroll-behavior:contain; }
  .ctx::-webkit-scrollbar { width:5px; }
  .ctx::-webkit-scrollbar-thumb { background:rgba(160,120,60,.55); }
  .ctx::-webkit-scrollbar-track { background:rgba(0,0,0,.18); }
  .panel.dense .ctx, .panel.dense2 .ctx { font-size:18px; line-height:1.62; }
  .panel.dense  .ctx, .panel.dense  .note, .panel.dense  .hr,
  .panel.dense  .cline, .panel.dense  .rgroup, .panel.dense  .tline { width:470px; }
  .panel.dense2 .ctx, .panel.dense2 .note, .panel.dense2 .hr,
  .panel.dense2 .cline, .panel.dense2 .rgroup, .panel.dense2 .tline { width:437px; }

  .note { width:502px; font-size:17.5px; line-height:1.6; color:rgb(214,166,116); opacity:1;
          font-weight:700; letter-spacing:1px;
          white-space:pre-wrap; text-align:center; }
  .note.emg {
    color:rgb(255,158,136); opacity:1; font-weight:900; font-size:16.5px; letter-spacing:2px;
    padding:8px 16px;
    background:linear-gradient(90deg, rgba(120,24,18,0) 0%, rgba(150,32,24,.5) 22%,
                                      rgba(168,38,28,.62) 50%, rgba(150,32,24,.5) 78%, rgba(120,24,18,0) 100%);
    border-top:1px solid rgba(226,104,84,.6); border-bottom:1px solid rgba(226,104,84,.6);
    text-shadow:0 0 14px rgba(255,110,80,.55), 0 1px 3px rgba(0,0,0,.85);
  }
  .panel.dense .note.emg, .panel.dense2 .note.emg { font-size:15px; padding:6px 14px; }

  .btns { width:100%; flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:20px; margin-top:2px; }
  .ctx + .btns { margin-top:16px; }
  .panel.dense .ctx + .btns  { margin-top:13px; }
  .panel.dense2 .ctx + .btns { margin-top:11px; }
  .panel.dense  .btns { gap:16px; }
  .panel.dense2 .btns { gap:13px; }
  .btns.cbtns { margin-top:18px; }
  .panel.dense  .btns.cbtns { margin-top:15px; }
  .panel.dense2 .btns.cbtns { margin-top:13px; }
  .btn {
    position:relative; width:390px; min-height:64px; flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    cursor:pointer; border:none; font-family:inherit; padding:9px 34px;
    background:url('../../Res/GameResult/UI_BonFire_Bg_001.png') center/100% 100% no-repeat;
    transition:transform .14s;
    -webkit-mask-image:url('../../Res/GameResult/UI_BonFire_Bg_001.png');
    -webkit-mask-size:100% 100%; -webkit-mask-repeat:no-repeat; -webkit-mask-position:center;
            mask-image:url('../../Res/GameResult/UI_BonFire_Bg_001.png');
            mask-size:100% 100%; mask-repeat:no-repeat; mask-position:center;
  }
  .panel.dense  .btn { min-height:51px; padding:7px 34px; }
  .panel.dense2 .btn { min-height:44px; padding:6px 34px; }

  .btn::before {
    content:''; position:absolute; inset:0; z-index:0; opacity:0; pointer-events:none;
    background:inherit; background-blend-mode:inherit; background-size:100% 100%;
    filter:brightness(1.30) sepia(.45) saturate(1.55) hue-rotate(-14deg);
    transition:opacity .16s;
  }
  .btn > * { position:relative; z-index:1; }
  .btn:hover::before { opacity:1; }
  .btn:hover { transform:translateY(-2px) scale(1.022); }
  .btn:hover .bname { color:#fff7e6; text-shadow:0 0 14px rgba(255,216,146,.55), 0 2px 4px rgba(0,0,0,.8); }
  .btn:hover .btip  { color:rgba(255,244,220,.92); }
  .btn:active { transform:translateY(0) scale(.99); }

  .bname { font-family:var(--wc-font-main); font-size:18px; font-weight:900; letter-spacing:2px; color:#f4e6c8;
           text-shadow:0 2px 4px rgba(0,0,0,.72); max-width:100%; text-align:center;
           white-space:normal; line-height:1.16; word-break:break-word;
           display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .panel.dense  .bname { font-size:15.5px; }
  .panel.dense2 .bname { font-size:13.5px; }
  .btip { font-size:12px; font-style:italic; color:rgba(240,232,210,.7); letter-spacing:.5px; line-height:1.2;
          max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .panel.dense  .btip { font-size:11px; }
  .panel.dense2 .btip { font-size:10px; }

  .btrack { position:absolute; inset:0; z-index:0;
            background:rgba(0,0,0,.2); }
  .bfill  { position:absolute; left:0; top:0; bottom:0; z-index:0;
            background:linear-gradient(90deg, rgba(255,216,132,.55), rgba(226,168,64,.396));
            border-right:2px solid rgba(255,238,196,.85);
            box-shadow:0 0 12px rgba(255,200,110,.45); }
  .emgv .bfill { background:linear-gradient(90deg, rgba(255,168,128,.55), rgba(226,96,72,.396));
                 border-right-color:rgba(255,214,196,.85);
                 box-shadow:0 0 12px rgba(255,130,100,.45); }

  .btn.dft { box-shadow:inset 0 0 0 2px rgba(226,186,110,.5), inset 0 0 16px rgba(226,170,80,.22); }

  .emgv .btn {
    background:
      linear-gradient(180deg, rgba(206,72,48,.34) 0%, rgba(158,36,24,.48) 100%),
      url('../../Res/GameResult/UI_BonFire_Bg_001.png') center/100% 100% no-repeat;
    background-blend-mode:multiply, normal;
  }
  .emgv .btn::before { filter:brightness(1.34) saturate(1.12); }
  .emgv .btn:hover .bname { text-shadow:0 0 14px rgba(255,180,150,.6), 0 2px 4px rgba(0,0,0,.8); }
  .emgv .btn.dft { box-shadow:inset 0 0 0 2px rgba(240,150,120,.5), inset 0 0 16px rgba(220,90,66,.24); }

  .btn.locked { cursor:not-allowed; filter:grayscale(.62) brightness(.5); }
  .btn.locked:hover { transform:none; }
  .btn.locked:hover::before { opacity:0; }
  .btn.locked .bname { color:#8b8371; }
  .btn.locked .btip  { color:#a89f8a; }
  .btn.locked::after { content:'✕'; position:absolute; right:18px; top:50%; transform:translateY(-50%);
                       font-size:17px; color:rgba(255,220,200,.45); }
  .btn.single { width:316px; }
  .btn.single {
    background:
      linear-gradient(180deg, rgba(150,206,116,.34) 0%, rgba(88,150,68,.46) 100%),
      url('../../Res/GameResult/UI_BonFire_Bg_001.png') center/100% 100% no-repeat;
    background-blend-mode:multiply, normal;
  }
  .btn.single::before { filter:brightness(1.34) saturate(1.12); }
  .btn.single:hover .bname { text-shadow:0 0 14px rgba(198,255,170,.6), 0 2px 4px rgba(0,0,0,.8); }
  .emgv .btn.single {
    background:
      linear-gradient(180deg, rgba(206,72,48,.34) 0%, rgba(158,36,24,.48) 100%),
      url('../../Res/GameResult/UI_BonFire_Bg_001.png') center/100% 100% no-repeat;
    background-blend-mode:multiply, normal;
  }

  .rgroup { position:relative; width:502px; display:flex; flex-direction:column; align-items:center; gap:7px;
            padding:12px 18px; }
  .rgroup::before, .rgroup::after {
    content:''; position:absolute; left:0; right:0; height:1px; pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(160,120,60,.55),transparent);
  }
  .rgroup::before { top:0; }
  .rgroup::after  { bottom:0; }
  .rg  { display:flex; align-items:flex-start; justify-content:center; gap:12px; max-width:100%; }
  /* 需求组与奖励组同样整组居中；进度条行给最小宽，免得进度条只有文字那么宽 */
  .rgn { flex:0 0 auto; font-family:var(--wc-font-main); font-size:13px; font-weight:900; letter-spacing:2px;
         color:rgba(196,142,98,.9); padding-top:4px; text-align:right; }
  .rgv { flex:0 1 auto; display:flex; flex-wrap:wrap; align-items:baseline; justify-content:center;
         gap:4px 22px; min-width:0; }
  .rgv.one { flex-direction:column; gap:6px; flex-wrap:nowrap; align-items:stretch; }
  .ritem { display:flex; align-items:baseline; gap:7px; font-size:17px; color:#e6d5b0; white-space:nowrap; }
  .rgv.one .ritem { width:100%; }
  .ritem .ico { font-size:16px; line-height:1; filter:saturate(.85); }
  .ritem .rl  { color:rgb(230,230,230); }
  .ritem .rl small { font-size:12.5px; color:rgba(230,230,230,.55); margin-left:5px; }
  .ritem .rv  { font-family:var(--wc-font-main); font-weight:900; letter-spacing:.5px; white-space:nowrap; }
  .rv.up   { color:rgb(140,205,120); }
  .rv.down { color:rgb(220,110,100); }
  .rv.neu  { color:rgb(220,180,90); }
  .ritem.mys .rl { color:rgb(203,191,81); font-style:italic; }
  .ritem.task { flex-direction:column; align-items:stretch; gap:5px; min-width:300px; }
  .ritem.task .r1 { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .ritem.task .pbar { height:5px; background:rgba(30,22,16,.85); border:1px solid rgba(120,85,45,.45); }
  .ritem.task .pbar i { display:block; height:100%; background:linear-gradient(90deg,rgb(220,180,90),rgb(196,142,98)); }
</style>
</head>
<body>
<div id="app">
  <div class="overlay" v-if="ready">
    <div class="panel unity-interactive" :class="panelClass" ref="panelEl">

      <div class="icon" v-if="showIcon">
        <img :src="state.iconUrl" @res-image-missing="iconOk = false">
        <div class="ibar">
          <span class="tw">
            <span class="badge line" v-if="lineInfo" :style="{ '--lc': lineInfo.color }"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" :d="lineInfo.icon"/></svg>{{ lineInfo.name }}</span>
            <span class="badge" v-else-if="showBadge" :class="{ emg: state.emergency, mls: isMilestone }">{{ tagLabel }}</span>
            <span class="title" :class="{ emg: state.emergency, mainv: isMain, mls: isMilestone }">
              {{ state.title }}<span class="mult" v-if="state.multText">{{ state.multText }}</span>
            </span>
          </span>
        </div>
      </div>

      <div class="tline" v-else>
        <span class="tw">
          <span class="badge line" v-if="lineInfo" :style="{ '--lc': lineInfo.color }"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" :d="lineInfo.icon"/></svg>{{ lineInfo.name }}</span>
          <span class="badge" v-else-if="showBadge" :class="{ emg: state.emergency, mls: isMilestone }">{{ tagLabel }}</span>
          <span class="title" :class="{ emg: state.emergency, mainv: isMain, mls: isMilestone }">
            {{ state.title }}<span class="mult" v-if="state.multText">{{ state.multText }}</span>
          </span>
        </span>
      </div>

      <div class="cline" v-if="cdTotal > 0">
        <div class="clock" :class="{ urgent: cdLeft <= 10 }">
          <span class="dot"></span><span>{{ cdLabel }}</span>
        </div>
      </div>

      <div class="hr"></div>

      <div class="ctx" v-if="state.desc">{{ state.desc }}</div>
      <div class="note" v-if="state.infoText" :class="{ emg: state.emergency }">{{ state.infoText }}</div>

      <div class="btns" v-if="isChoice">
        <button v-for="opt in state.options" :key="opt.Index"
                class="btn unity-interactive"
                :class="{ locked: !opt.Enabled, dft: opt.IsDefault && cdTotal > 0 }"
                @click="onChoose(opt)">
          <span class="bname">{{ opt.Label }}</span>
          <span class="btip" v-if="tipOf(opt)">{{ tipOf(opt) }}</span>
          <template v-if="opt.IsDefault && cdTotal > 0">
            <span class="btrack" data-no-sync></span>
            <span class="bfill" data-no-sync :style="{ width: cdFillPct + '%' }"></span>
          </template>
        </button>
      </div>

      <template v-else>
        <div class="rgroup" v-if="groups.length">
          <div class="rg" :class="{ one: g.one }" v-for="(g, gi) in groups" :key="gi">
            <div class="rgn">{{ groupName(g.n) }}</div>
            <div class="rgv" :class="{ one: g.one }">
              <template v-for="(it, ii) in g.v" :key="ii">
                <div class="ritem task" v-if="it.p !== undefined && it.p !== null">
                  <div class="r1">
                    <span class="rl">{{ it.l }}<small v-if="it.s">{{ it.s }}</small></span>
                    <span class="rv" :class="it.c || 'neu'">{{ it.x }}</span>
                  </div>
                  <div class="pbar"><i :style="{ width: pct(it.p) }"></i></div>
                </div>
                <div class="ritem" :class="{ mys: it.mys }" v-else>
                  <span class="ico" v-if="it.i">{{ it.i }}</span>
                  <span class="rl">{{ it.l }}<small v-if="it.s">{{ it.s }}</small></span>
                  <span class="rv" :class="it.c || 'neu'" v-if="it.x">{{ it.x }}</span>
                </div>
              </template>
            </div>
          </div>
        </div>
        <div class="btns cbtns">
          <button class="btn single unity-interactive" @click="onConfirm">
            <span class="bname">{{ (state.viewOnly ? '' : state.okText) || localText.confirmFallback || '确定' }}</span>
          </button>
        </div>
      </template>

    </div>
  </div>
</div>

<script>
const { createApp, reactive, ref, computed, onMounted, nextTick } = Vue;
createApp({
  setup() {
    const core = createWebUICore('EventChoice');

    const state = reactive({
      tagText:'', endingLine:'', title:'', desc:'', infoText:'',
      hasIcon:false, iconUrl:'',
      mode:'choice', emergency:false, viewOnly:false,
      okText:'', multText:'', countdown:0, options:[], rewardJson:''
    });
    const localText = reactive({
      pickHint:'', defaultTag:'', gateTag:'', gateFallback:'', gateFoot:'', confirmFallback:'',
      tagMain:'', tagEmergency:'', tagMilestone:'',
      lineShelter:'', lineRescue:'', lineTruth:'', lineCompanion:'', lineGirl:'', lineGreenhouse:'', lineStranger:'', lineSupply:'', lineChallenge:'',
      groupRequire:'', groupAttr:'', groupAttrMax:'', groupItem:'', groupPoint:'', groupState:'', groupOther:''
    });

    const TAG_TEXT = { main:['tagMain','主线'], emergency:['tagEmergency','危机'], milestone:['tagMilestone','关注'] };
    const GROUP_TEXT = {
      require:['groupRequire','需求'], attr:['groupAttr','属性'], attrmax:['groupAttrMax','属性上限'],
      item:['groupItem','物资'], point:['groupPoint','点数'], state:['groupState','状态'], other:['groupOther','其他']
    };
    // 结局线路：key → [词条字段, 中文兜底, 线路色, 图标 path]。key 由 C# EventEndingLineUiKey 下发，
    // 颜色与图标与 CoreUI1.html 的 LINE_ICON 同源。
    const LINE = {
      shelter:    ['lineShelter',    '安全屋', '#b9c6d2', 'M12 2 L20 5 V11 C20 16.5 16.6 20.6 12 22 C7.4 20.6 4 16.5 4 11 V5 Z'],
      rescue:     ['lineRescue',     '救援',   '#ef7d55', 'M12 2.5 A9.5 9.5 0 1 1 12 21.5 A9.5 9.5 0 1 1 12 2.5 Z M12 7.5 A4.5 4.5 0 1 0 12 16.5 A4.5 4.5 0 1 0 12 7.5 Z M10.6 2.6 H13.4 V7.6 H10.6 Z M10.6 16.4 H13.4 V21.4 H10.6 Z M2.6 10.6 H7.6 V13.4 H2.6 Z M16.4 10.6 H21.4 V13.4 H16.4 Z'],
      truth:      ['lineTruth',      '真相',   '#aa8ef0', 'M10 3 A7 7 0 1 1 10 17 A7 7 0 1 1 10 3 Z M10 6 A4 4 0 1 0 10 14 A4 4 0 1 0 10 6 Z M15 15.5 L21.5 22 L20 23.5 L13.5 17 Z'],
      companion:  ['lineCompanion',  '陪伴',   '#ef93b6', 'M12 21 C12 21 3 15 3 9 A4.6 4.6 0 0 1 12 7 A4.6 4.6 0 0 1 21 9 C21 15 12 21 12 21 Z'],
      girl:       ['lineGirl',       '女孩',   '#ef93b6', 'M12 21 C12 21 3 15 3 9 A4.6 4.6 0 0 1 12 7 A4.6 4.6 0 0 1 21 9 C21 15 12 21 12 21 Z'],
      greenhouse: ['lineGreenhouse', '温室',   '#8ccf6c', 'M11 22 V12 C6 12 3.5 9 3.5 4.5 C8 4.5 11 7 11 11 C11.5 6.5 14.5 3 20.5 3 C20.5 8.5 17.5 11.5 13 11.8 V22 Z'],
      stranger:   ['lineStranger',   '陌生人', '#5ccaca', 'M10 2 H14 L15 6 H9 Z M9 7 H15 L16.5 20 H7.5 Z M5 21 H19 V23 H5 Z M3 4 L7 5.5 L3 7 Z M21 4 L17 5.5 L21 7 Z'],
      supply:     ['lineSupply',     '补给站', '#6fa3ee', 'M3 7 L12 3 L21 7 V17 L12 21 L3 17 Z M12 5.2 L6.4 7.6 L12 10 L17.6 7.6 Z M5 9.2 V15.8 L11 18.4 V11.8 Z M13 11.8 V18.4 L19 15.8 V9.2 Z'],
      // 挑战结局：文字统一「挑战」、统一暗金，靠图标区分；chl_ 前缀的线路不按主线样式显示
      chl_promise:  ['lineChallenge', '挑战', '#e2b45a', 'M3 4.5 H21 V6 H3 Z M11.25 6 H12.75 V8 H11.25 Z M4.5 12 C4.5 9.5 7 8 10 8 C13 8 15 9.5 15.5 11 H21 V13 H15.5 C15 14.5 13 16 10 16 C7 16 4.5 14.5 4.5 12 Z M6.5 11.5 H10 V9.5 C8 9.5 6.8 10.3 6.5 11.5 Z M6 18.5 H16 V20 H6 Z M8 16 H9.5 V18.5 H8 Z M12 16 H13.5 V18.5 H12 Z'],
      chl_street:   ['lineChallenge', '挑战', '#e2b45a', 'M12 2 L20 5 V11 C20 16.5 16.6 20.6 12 22 C7.4 20.6 4 16.5 4 11 V5 Z M5.8 10 H18.2 V12.6 H5.8 Z'],
      chl_district: ['lineChallenge', '挑战', '#e2b45a', 'M12 2 L20 5 V11 C20 16.5 16.6 20.6 12 22 C7.4 20.6 4 16.5 4 11 V5 Z M5.8 7.6 H18.2 V9.4 H5.8 Z M5.8 11 H18.2 V12.8 H5.8 Z M6.6 14.4 H17.4 V16.2 H6.6 Z'],
      chl_camp:     ['lineChallenge', '挑战', '#e2b45a', 'M12 3 L22.5 20 H1.5 Z M12 9.5 L15.8 20 H8.2 Z'],
      chl_seed:     ['lineChallenge', '挑战', '#e2b45a', 'M12 3 C17 7 18 12 16 16 C14.5 19 9.5 19 8 16 C6 12 7 7 12 3 Z M12 7 C10.8 10 10.8 14 12 17 C13.2 14 13.2 10 12 7 Z']
    };
    const pickText = (map, key) => { const e = map[key]; return e ? (localText[e[0]] || e[1]) : ''; };

    const cdTotal = ref(0), cdLeft = ref(0);
    let cdRaf = 0, cdT0 = 0, cdFired = false;

    const cdLabel = computed(() => {
      const s = Math.max(0, Math.ceil(cdLeft.value));
      return String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
    });
    const cdFillPct = computed(() =>
      cdTotal.value > 0 ? Math.round(cdLeft.value / cdTotal.value * 200) / 2 : 0);

    function stopCountdown() { if (cdRaf) { cancelAnimationFrame(cdRaf); cdRaf = 0; } }
    function startCountdown(total) {
      stopCountdown(); cdFired = false;
      cdTotal.value = total; cdLeft.value = total;
      if (!(total > 0)) return;
      cdT0 = performance.now();
      const step = (now) => {
        const left = total - (now - cdT0) / 1000;
        cdLeft.value = left > 0 ? left : 0;
        if (left > 0) { cdRaf = requestAnimationFrame(step); return; }
        cdRaf = 0;
        if (!cdFired) { cdFired = true; core.UnitySendEvent('TIMEEND', {}); }
      };
      cdRaf = requestAnimationFrame(step);
    }

    const iconOk = ref(true);
    const showIcon = computed(() => state.hasIcon && state.iconUrl && iconOk.value);

    const ready = ref(false);
    let readyFallback = setTimeout(() => { ready.value = true; }, 1200);
    function markReady() {
      if (ready.value) return;
      clearTimeout(readyFallback);
      ready.value = true;
      nextTick(() => core.clickThrough && core.clickThrough.syncNow());
    }
    const isChoice = computed(() => state.mode === 'choice');

    const groups = computed(() => {
      if (!state.rewardJson) return [];
      try { const g = JSON.parse(state.rewardJson); return Array.isArray(g) ? g : []; }
      catch (e) { console.error('[EventChoice] rewardJson 解析失败', e); return []; }
    });

    const panelClass = computed(() => {
      const cls = [];
      if (state.emergency) cls.push('emgv');
      if (isChoice.value) {
        const n = state.options.length;
        if (n >= 6) cls.push('dense2');
        else if (n >= 4) cls.push('dense');
      } else {
        const rows = groups.value.reduce((a, g) => a + (g.one ? (g.v ? g.v.length : 0) : 1), 0);
        if (rows >= 6) cls.push('dense');
      }
      return cls;
    });

    const tipOf = (opt) => opt.Enabled ? (opt.SubLabel || '') : (opt.Reason || localText.gateFallback || '');
    const pct = (p) => Math.round(Math.max(0, Math.min(1, p)) * 100) + '%';
    const tagLabel = computed(() => pickText(TAG_TEXT, state.tagText));
    const isMain = computed(() => state.tagText === 'main' && !String(state.endingLine || '').startsWith('chl_'));
    const isMilestone = computed(() => state.tagText === 'milestone');
    const showBadge = computed(() => !!tagLabel.value && !isMain.value);
    const groupName = (key) => pickText(GROUP_TEXT, key);
    const lineInfo = computed(() => {
      const e = LINE[state.endingLine];
      return e ? { name: localText[e[0]] || e[1], color: e[2], icon: e[3] } : null;
    });

    core.registerHandlers({
      'WebUI_EventChoice_Msg': (data) => {
        ['tagText','endingLine','title','desc','infoText','hasIcon','iconUrl','mode','emergency','viewOnly','okText','multText','rewardJson']
          .forEach(k => { if (data[k] !== undefined) state[k] = data[k]; });
        if (data.iconUrl !== undefined) iconOk.value = true;
        if (data.countdown !== undefined) {
          state.countdown = data.countdown;
          startCountdown(data.countdown > 0 ? data.countdown : 0);
        }
        markReady();
      },
      'WebUI_EventChoice_OptionMsg': (data) => {
        if (data.optionList && Array.isArray(data.optionList)) state.options = data.optionList;
      },
      'WebUI_EventChoice_LocalizationMsg': (data) => {
        Object.keys(localText).forEach(k => { if (data[k]) localText[k] = data[k]; });
      }
    });

    const onChoose = (opt) => { stopCountdown(); core.UnitySendEvent('CHOOSE', { index: opt.Index }); };
    const onConfirm = () => { stopCountdown(); core.UnitySendEvent('CONFIRM', {}); };

    onMounted(() => { core.clickThrough.start(); });
    core.notifyReady();

    return { ready, state, localText, isChoice, groups, panelClass, cdTotal, cdLeft, cdLabel, cdFillPct,
             iconOk, showIcon, tipOf, pct, tagLabel, isMain, isMilestone, showBadge, lineInfo, groupName, onChoose, onConfirm };
  }
}).mount('#app');
</script>
</body>
</html>
